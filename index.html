<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff0000'><path d='M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z'/></svg>">
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1e1e1e;
      --surface-hover: #272727;
      --surface-active: #3f3f3f;
      --text: #f1f1f1;
      --text-muted: #aaaaaa;
      --yt-red: #ff0000;
      --border: #2e2e2e;
      --chip-bg: #272727;
      --chip-hover: #383838;
      --chip-active-bg: #f1f1f1;
      --chip-active-text: #0f0f0f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Roboto", "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Navigation Bar */
    header {
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 100;
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-back-btn {
      background: transparent;
      border: none;
      color: var(--text);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, opacity 0.15s ease;
    }

    .nav-back-btn:hover:not(:disabled) {
      background: var(--surface-hover);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      text-decoration: none;
      color: var(--text);
      letter-spacing: -0.5px;
      font-size: 1.15rem;
      font-weight: 700;
      user-select: none;
    }

    .brand svg {
      width: 30px;
      height: 22px;
      fill: var(--yt-red);
    }

    .header-center {
      flex: 1;
      max-width: 640px;
      margin: 0 16px;
      display: flex;
      align-items: center;
    }

    .search-form {
      display: flex;
      width: 100%;
      height: 40px;
    }

    .search-input-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      height: 100%;
      background: #121212;
      border: 1px solid var(--border);
      border-radius: 40px 0 0 40px;
      padding: 0 16px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-input:focus {
      border-color: #1c62b9;
    }

    .search-btn {
      width: 64px;
      height: 40px;
      background: #222222;
      border: 1px solid var(--border);
      border-left: none;
      border-radius: 0 40px 40px 0;
      cursor: pointer;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
    }

    .search-btn:hover {
      background: #2a2a2a;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .engine-badge {
      background: #1f1f1f;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 20px;
      font-size: 0.8rem;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .engine-badge select {
      background: transparent;
      border: none;
      color: #3ea6ff;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      outline: none;
    }

    /* Category Chips / Pills */
    .chips-bar {
      position: sticky;
      top: 56px;
      z-index: 90;
      background: var(--bg);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .chips-bar::-webkit-scrollbar { display: none; }

    .chip {
      background: var(--chip-bg);
      color: var(--text);
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .chip:hover {
      background: var(--chip-hover);
    }

    .chip.active {
      background: var(--chip-active-bg);
      color: var(--chip-active-text);
      font-weight: 600;
    }

    /* Main Content Area */
    main {
      flex: 1;
      max-width: 1800px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 24px 60px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Theater Player Section */
    #player-section {
      display: none;
      flex-direction: column;
      gap: 12px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .video-viewport {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 */
      background: #000;
    }

    .video-viewport iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .player-details {
      background: var(--surface);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .player-title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .player-video-title {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .close-player-btn {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s ease;
    }

    .close-player-btn:hover { background: var(--surface-active); }

    .player-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .player-channel {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
      transition: background 0.15s ease;
    }

    .player-channel:hover {
      background: var(--surface-hover);
    }

    .player-channel-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #333;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    .player-channel-name {
      font-weight: 600;
      font-size: 0.98rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .player-channel-cta {
      font-size: 0.78rem;
      color: #3ea6ff;
    }

    .player-engine-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .player-engine-controls select {
      background: var(--surface-hover);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      outline: none;
      cursor: pointer;
    }

    /* Channel Profile View Header */
    #channel-header-section {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .channel-banner-wrapper {
      width: 100%;
      height: 180px;
      max-height: 220px;
      background: linear-gradient(135deg, #1f1f1f, #2e2e2e);
      overflow: hidden;
      display: none;
    }

    .channel-banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .channel-profile-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 24px;
      flex-wrap: wrap;
    }

    .channel-profile-left {
      display: flex;
      align-items: center;
      gap: 18px;
      flex: 1;
      min-width: 260px;
    }

    .channel-profile-avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: cover;
      background: #252525;
      border: 2px solid var(--border);
      flex-shrink: 0;
    }

    .channel-profile-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .channel-profile-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .channel-profile-name {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .channel-verified-badge {
      background: #717171;
      color: #fff;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
    }

    .channel-profile-meta {
      font-size: 0.88rem;
      color: var(--text-muted);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .channel-profile-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
      max-width: 700px;
      margin-top: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .subscribe-btn {
      background: #f1f1f1;
      color: #0f0f0f;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 10px 20px;
      border-radius: 24px;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      white-space: nowrap;
    }

    .subscribe-btn:hover {
      background: #d9d9d9;
    }

    .subscribe-btn.subscribed {
      background: #272727;
      color: #f1f1f1;
      border: 1px solid var(--border);
    }

    /* Section Title & Nav Back Bar */
    .feed-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 4px;
      margin-bottom: 2px;
    }

    .feed-title-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .feed-back-btn {
      display: none;
      align-items: center;
      gap: 6px;
      background: var(--chip-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .feed-back-btn:hover {
      background: var(--chip-hover);
      border-color: #444;
    }

    .feed-title {
      font-size: 1.35rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Video Cards Grid */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 22px 16px;
    }

    @media (min-width: 1400px) {
      .video-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .video-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      cursor: pointer;
      border-radius: 12px;
      transition: transform 0.15s ease;
    }

    .video-card:hover .thumb-img {
      border-radius: 0;
    }

    .thumb-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 12px;
      overflow: hidden;
      background: #181818;
    }

    .thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: border-radius 0.2s ease;
      background: #181818;
    }

    .video-duration {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.84);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 6px;
      border-radius: 4px;
      letter-spacing: 0.3px;
    }

    .video-meta {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .avatar-clickable {
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }

    .avatar-clickable:hover {
      transform: scale(1.08);
    }

    .channel-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #252525;
      object-fit: cover;
      display: block;
    }

    .video-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
      flex: 1;
    }

    .video-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .channel-title {
      font-size: 0.83rem;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      width: fit-content;
      transition: color 0.15s ease;
    }

    .channel-title:hover {
      color: var(--text);
      text-decoration: underline;
    }

    .video-substats {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Loading / Spinner */
    .loading-container {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      gap: 16px;
      color: var(--text-muted);
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--yt-red);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-container {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .error-btn {
      background: #3ea6ff;
      color: #0f0f0f;
      border: none;
      padding: 8px 18px;
      border-radius: 18px;
      font-weight: 600;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      header { padding: 0 10px; }
      .header-right { display: none; }
      main { padding: 12px; }
      .chips-bar { padding: 10px 12px; }
      .channel-banner-wrapper { height: 110px; }
      .channel-profile-card { padding: 14px 16px; }
      .channel-profile-avatar { width: 56px; height: 56px; }
      .channel-profile-name { font-size: 1.2rem; }
    }

    /* Related Videos Inside Player (No Ads / In-App Playback) */
    .player-related-section {
      padding-top: 18px;
      margin-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .related-heading h3 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .related-videos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .related-video-card {
      display: flex;
      gap: 12px;
      background: var(--surface);
      border-radius: 10px;
      padding: 8px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      border: 1px solid transparent;
      user-select: none;
    }

    .related-video-card:hover {
      background: var(--surface-hover);
      transform: translateY(-2px);
      border-color: var(--border);
    }

    .rel-thumb-wrap {
      width: 120px;
      min-width: 120px;
      aspect-ratio: 16 / 9;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      background: #1a1a1a;
      flex-shrink: 0;
    }

    .rel-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .rel-duration {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-size: 0.72rem;
      padding: 1px 4px;
      border-radius: 4px;
      font-weight: 500;
    }

    .rel-meta {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 4px;
      overflow: hidden;
      flex: 1;
    }

    .rel-title {
      font-size: 0.86rem;
      font-weight: 600;
      line-height: 1.25;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .rel-channel {
      font-size: 0.78rem;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rel-stats {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header>
    <div class="header-left">
      <button class="nav-back-btn" id="nav-back-btn" onclick="goBack()" title="Revenir en arrière" style="opacity: 0.35; cursor: default;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <a class="brand" onclick="goHome()" title="Accueil YouTube">
        <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        <span>YouTube</span>
      </a>
    </div>

    <div class="header-center">
      <form class="search-form" id="search-form" onsubmit="onSearchSubmit(event)">
        <div class="search-input-wrapper">
          <input type="text" class="search-input" id="search-input" placeholder="Rechercher ou coller un lien YouTube..." autocomplete="off">
        </div>
        <button type="submit" class="search-btn" title="Rechercher">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
      </form>
    </div>

    <div class="header-right">
      <div class="engine-badge">
        <span>Lecteur :</span>
        <select id="global-engine" onchange="onGlobalEngineChange(this.value)">
          <option value="piped" selected>Piped (Sans pub)</option>
          <option value="pipedCoffee">Piped Coffee (Sans pub)</option>
          <option value="yewtu">Invidious (Sans pub)</option>
          <option value="nocookie">YouTube NoCookie</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Category Chips -->
  <nav class="chips-bar" id="chips-bar">
    <button class="chip active" onclick="selectChip(this, () => loadTrending(true))">🔥 Tendances</button>
    <button class="chip" onclick="selectChip(this, () => searchVideos('Musique 2026', true))">🎵 Musique</button>
    <button class="chip" onclick="selectChip(this, () => searchVideos('Jeux vidéo gaming fr', true))">🎮 Jeux vidéo</button>
    <button class="chip" onclick="selectChip(this, () => searchVideos('Documentaire science', true))">🔬 Science</button>
    <button class="chip" onclick="selectChip(this, () => searchVideos('Lofi hip hop live', true))">🎧 Lofi</button>
    <button class="chip" onclick="selectChip(this, () => searchVideos('Actualités France', true))">📰 Actualités</button>
    <button class="chip" onclick="selectChip(this, () => searchVideos('Tech informatique programmation', true))">💻 Informatique</button>
  </nav>

  <!-- Main View -->
  <main>
    <!-- Player Section -->
    <section id="player-section">
      <div class="video-viewport">
        <iframe id="video-frame" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
      </div>
      <div class="player-details">
        <div class="player-title-row">
          <h2 class="player-video-title" id="player-title">Titre de la vidéo</h2>
          <button class="close-player-btn" onclick="closePlayer(true)" title="Fermer le lecteur">✕</button>
        </div>
        <div class="player-meta-row">
          <div class="player-channel" onclick="onPlayerChannelClick()" title="Cliquer pour accéder à la chaîne">
            <img class="player-channel-avatar" id="player-avatar" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23666'><circle cx='12' cy='12' r='10'/></svg>" alt="">
            <div>
              <div class="player-channel-name">
                <span id="player-channel">Chaîne</span>
                <span class="player-channel-cta">• Voir la chaîne →</span>
              </div>
              <div style="font-size: 0.8rem; color: var(--text-muted);" id="player-stats">Lecture en cours</div>
            </div>
          </div>
          <div class="player-engine-controls">
            <span>Moteur :</span>
            <select id="player-engine-select" onchange="switchEngine(this.value)">
              <option value="piped" selected>Piped (Sans pub)</option>
              <option value="pipedCoffee">Piped Coffee (Sans pub)</option>
              <option value="yewtu">Invidious (Sans pub)</option>
              <option value="nocookie">YouTube NoCookie</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Vidéos recommandées (lecture directe dans l'application sans pub) -->
      <div class="player-related-section" id="player-related-section">
        <div class="related-heading">
          <h3>🎬 Vidéos recommandées (lecture directe sans pub)</h3>
        </div>
        <div class="related-videos-grid" id="related-videos-grid"></div>
      </div>
    </section>

    <!-- Channel Profile Section -->
    <section id="channel-header-section">
      <div class="channel-banner-wrapper" id="channel-banner-wrapper">
        <img id="channel-banner-img" class="channel-banner-img" src="" alt="Bannière de la chaîne">
      </div>
      <div class="channel-profile-card">
        <div class="channel-profile-left">
          <img id="channel-profile-avatar" class="channel-profile-avatar" src="" alt="Avatar">
          <div class="channel-profile-info">
            <div class="channel-profile-name-row">
              <h2 id="channel-profile-name" class="channel-profile-name">Nom de la chaîne</h2>
              <span id="channel-verified-badge" class="channel-verified-badge" title="Vérifié">✓</span>
            </div>
            <div class="channel-profile-meta">
              <span id="channel-subscribers-count">0 abonnés</span>
              <span>•</span>
              <span id="channel-videos-count">Vidéos</span>
            </div>
            <p id="channel-profile-desc" class="channel-profile-desc"></p>
          </div>
        </div>
        <div>
          <button class="subscribe-btn" id="channel-sub-btn" onclick="toggleSubscribe(this)">S'abonner</button>
        </div>
      </div>
    </section>

    <!-- Feed Header with Navigation Back Button -->
    <div class="feed-header">
      <div class="feed-title-container">
        <button id="feed-back-btn" class="feed-back-btn" onclick="goBack()" title="Revenir en arrière">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          <span>Retour</span>
        </button>
        <h1 class="feed-title" id="feed-title">🔥 Tendances</h1>
      </div>
    </div>

    <!-- Video Grid -->
    <div class="video-grid" id="video-grid">
      <div class="loading-container">
        <div class="spinner"></div>
        <p>Chargement des tendances...</p>
      </div>
    </div>
  </main>

  <script>
    // Public Piped API instances with verified CORS support
    const PIPED_APIS = [
      'https://api.piped.private.coffee',
      'https://pipedapi.ducks.party',
      'https://pipedapi.adminforge.de'
    ];

    let currentVideoId = '';
    let currentVideoObj = null;
    let currentEngine = 'piped';
    let currentView = { type: 'trending' };
    let hasNavigated = false;
    let currentVideoChannel = null;

    const ENGINES = {
      piped: id => `https://piped.video/embed/${id}?autoplay=1`,
      pipedCoffee: id => `https://piped.private.coffee/embed/${id}?autoplay=1`,
      yewtu: id => `https://yewtu.be/embed/${id}?autoplay=1`,
      nocookie: id => `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0`
    };

    // Helper: Query Piped API with automatic failover
    async function apiRequest(endpoint) {
      let lastError = null;
      for (const base of PIPED_APIS) {
        try {
          const res = await fetch(base + endpoint, { signal: AbortSignal.timeout(6500) });
          if (res.ok) {
            return await res.json();
          }
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error("API non joignable");
    }

    // Video ID extractor
    function extractVideoId(input) {
      if (!input) return null;
      input = input.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
      const patterns = [
        /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/|yewtu\.be\/watch\?v=)([a-zA-Z0-9_-]{11})/,
        /v=([a-zA-Z0-9_-]{11})/
      ];
      for (const p of patterns) {
        const m = input.match(p);
        if (m) return m[1];
      }
      return null;
    }

    // Navigation & Back handler
    function updateNavButtons() {
      const isHome = currentView.type === 'trending' && !currentVideoId;
      const navBack = document.getElementById('nav-back-btn');
      const feedBack = document.getElementById('feed-back-btn');

      if (navBack) {
        if (!isHome || hasNavigated) {
          navBack.style.opacity = '1';
          navBack.style.cursor = 'pointer';
        } else {
          navBack.style.opacity = '0.35';
          navBack.style.cursor = 'default';
        }
      }

      if (feedBack) {
        feedBack.style.display = isHome ? 'none' : 'inline-flex';
      }
    }

    function goBack() {
      if (hasNavigated && window.history.length > 1) {
        window.history.back();
      } else {
        if (currentVideoId) {
          closePlayer(false);
        } else {
          goHome();
        }
      }
    }

    function goHome() {
      closePlayer(false);
      clearChannelHeader();
      document.getElementById('search-input').value = '';
      document.querySelectorAll('.chip').forEach((c, i) => c.classList.toggle('active', i === 0));
      loadTrending(true);
    }

    // Handle Browser History (Back / Forward buttons)
    window.addEventListener('popstate', (e) => {
      const state = e.state;
      if (!state || state.view === 'trending') {
        closePlayer(false);
        clearChannelHeader();
        loadTrending(false);
      } else if (state.view === 'search') {
        closePlayer(false);
        clearChannelHeader();
        document.getElementById('search-input').value = state.query || '';
        searchVideos(state.query, false);
      } else if (state.view === 'channel') {
        closePlayer(false);
        openChannel(state.channelId, state.channelName, state.avatarUrl, false);
      } else if (state.view === 'player') {
        if (state.video) {
          playVideo(state.video, false);
        }
      }
      updateNavButtons();
    });

    // Play video in theater mode
    function playVideo(video, push = true) {
      if (!video || !video.id) return;
      currentVideoId = video.id;
      currentVideoObj = video;

      currentVideoChannel = {
        id: video.channelId || (video.uploaderUrl || '').replace('/channel/', ''),
        name: video.uploader || 'Chaîne YouTube',
        avatar: video.avatar || ''
      };

      if (push) {
        history.pushState(
          { view: 'player', video, prevView: currentView },
          '',
          `?v=${video.id}`
        );
        hasNavigated = true;
      }
      updateNavButtons();

      const engine = document.getElementById('global-engine').value;
      currentEngine = engine;
      document.getElementById('player-engine-select').value = engine;

      const frame = document.getElementById('video-frame');
      frame.src = ENGINES[engine](video.id);

      document.getElementById('player-title').textContent = video.title || 'Vidéo';
      document.getElementById('player-channel').textContent = video.uploader || 'Chaîne YouTube';
      document.getElementById('player-stats').textContent = [video.viewsText, video.uploadedText].filter(Boolean).join(' • ') || 'Lecture en cours';
      
      const avatarEl = document.getElementById('player-avatar');
      if (video.avatar) {
        avatarEl.src = video.avatar;
      } else {
        avatarEl.src = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23666'><circle cx='12' cy='12' r='10'/></svg>";
      }

      const playerSec = document.getElementById('player-section');
      playerSec.style.display = 'flex';
      playerSec.scrollIntoView({ behavior: 'smooth', block: 'start' });

      // Charger les vidéos recommandées associées sans pub
      loadRelatedVideos(video.id);
    }

    
    // Charger et afficher les vidéos recommandées pour lecture directe
    async function loadRelatedVideos(videoId) {
      const container = document.getElementById('related-videos-grid');
      if (!container) return;
      container.innerHTML = '<div style="padding:15px; color:#aaa; font-size:0.9rem;">Chargement des vidéos recommandées...</div>';

      try {
        const data = await apiRequest(`/streams/${videoId}`);
        const related = (data && data.relatedStreams) ? data.relatedStreams : [];
        if (!related || related.length === 0) {
          container.innerHTML = '<div style="padding:10px; color:#777; font-size:0.85rem;">Aucune recommandation trouvée.</div>';
          return;
        }

        container.innerHTML = '';
        related.slice(0, 16).forEach(item => {
          const relId = (item.url || '').replace('/watch?v=', '');
          if (!relId || !item.title) return;

          const card = document.createElement('div');
          card.className = 'related-video-card';
          const durationStr = formatDuration(item.duration);
          const viewsStr = formatViews(item.views);
          const thumb = item.thumbnail || `https://i.ytimg.com/vi/${relId}/hqdefault.jpg`;
          const chName = item.uploaderName || 'Chaîne YouTube';

          const relObj = {
            id: relId,
            title: item.title,
            thumbnail: thumb,
            uploader: chName,
            uploaderUrl: item.uploaderUrl,
            channelId: (item.uploaderUrl || '').replace('/channel/', ''),
            avatar: item.uploaderAvatar || '',
            views: item.views,
            viewsText: viewsStr,
            uploadedText: item.uploadedDate || ''
          };

          card.onclick = () => {
            playVideo(relObj, true);
          };

          card.innerHTML = `
            <div class="rel-thumb-wrap">
              <img src="${escapeHtml(thumb)}" alt="" loading="lazy" onerror="this.src='https://i.ytimg.com/vi/${relId}/hqdefault.jpg'">
              ${durationStr ? `<span class="rel-duration">${durationStr}</span>` : ''}
            </div>
            <div class="rel-meta">
              <div class="rel-title" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</div>
              <div class="rel-channel">${escapeHtml(chName)}</div>
              <div class="rel-stats">${viewsStr || ''}</div>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error('Error fetching related streams:', err);
        container.innerHTML = '<div style="padding:10px; color:#777; font-size:0.85rem;">Recommandations temporairement indisponibles.</div>';
      }
    }

    function onPlayerChannelClick() {
      if (currentVideoChannel && (currentVideoChannel.id || currentVideoChannel.name)) {
        openChannel(currentVideoChannel.id, currentVideoChannel.name, currentVideoChannel.avatar, true);
      }
    }

    function switchEngine(engine) {
      currentEngine = engine;
      document.getElementById('global-engine').value = engine;
      document.getElementById('player-engine-select').value = engine;
      if (currentVideoId) {
        document.getElementById('video-frame').src = ENGINES[engine](currentVideoId);
      }
    }

    function onGlobalEngineChange(val) {
      switchEngine(val);
    }

    function closePlayer(popHistory = false) {
      const playerSec = document.getElementById('player-section');
      playerSec.style.display = 'none';
      document.getElementById('video-frame').src = '';
      currentVideoId = '';
      currentVideoObj = null;
      const relGrid = document.getElementById('related-videos-grid');
      if (relGrid) relGrid.innerHTML = '';

      if (popHistory && window.history.state && window.history.state.view === 'player') {
        window.history.back();
      } else {
        // Restore appropriate URL for current view
        if (currentView.type === 'trending') {
          window.history.replaceState({ view: 'trending' }, '', window.location.pathname);
        } else if (currentView.type === 'search') {
          window.history.replaceState({ view: 'search', query: currentView.query }, '', `?q=${encodeURIComponent(currentView.query)}`);
        } else if (currentView.type === 'channel') {
          window.history.replaceState({ view: 'channel', channelId: currentView.channelId, channelName: currentView.channelName, avatarUrl: currentView.avatarUrl }, '', `?c=${encodeURIComponent(currentView.channelId)}&name=${encodeURIComponent(currentView.channelName || '')}`);
        }
      }
      updateNavButtons();
    }

    // Load Trending Videos
    async function loadTrending(push = true) {
      if (push) {
        history.pushState({ view: 'trending' }, '', window.location.pathname);
        hasNavigated = true;
      }
      currentView = { type: 'trending' };
      clearChannelHeader();
      updateNavButtons();

      const grid = document.getElementById('video-grid');
      const title = document.getElementById('feed-title');
      title.textContent = '🔥 Tendances (France)';
      grid.innerHTML = `
        <div class="loading-container">
          <div class="spinner"></div>
          <p>Chargement des tendances YouTube...</p>
        </div>`;

      try {
        const data = await apiRequest('/trending?region=FR');
        if (!Array.isArray(data) || data.length === 0) throw new Error("Aucun résultat");
        
        const items = data.map(item => {
          const chId = (item.uploaderUrl || '').replace('/channel/', '');
          return {
            id: (item.url || '').replace('/watch?v=', ''),
            title: item.title,
            thumbnail: item.thumbnail || `https://i.ytimg.com/vi/${(item.url || '').replace('/watch?v=', '')}/hqdefault.jpg`,
            duration: item.duration,
            uploader: item.uploaderName,
            uploaderUrl: item.uploaderUrl,
            channelId: chId,
            avatar: item.uploaderAvatar,
            views: item.views,
            uploadedText: item.uploadedDate || ''
          };
        }).filter(x => x.id && x.title);

        renderGrid(items);
      } catch (err) {
        console.error(err);
        grid.innerHTML = `
          <div class="error-container">
            <p>Impossible de charger les tendances en direct.</p>
            <button class="error-btn" onclick="loadTrending(false)">Réessayer</button>
          </div>`;
      }
    }

    // Search Videos
    async function searchVideos(query, push = true) {
      if (!query || !query.trim()) return;
      query = query.trim();

      if (push) {
        history.pushState({ view: 'search', query }, '', `?q=${encodeURIComponent(query)}`);
        hasNavigated = true;
      }
      currentView = { type: 'search', query };
      clearChannelHeader();
      updateNavButtons();

      const grid = document.getElementById('video-grid');
      const title = document.getElementById('feed-title');
      title.textContent = `Résultats pour "${query}"`;
      grid.innerHTML = `
        <div class="loading-container">
          <div class="spinner"></div>
          <p>Recherche de "${escapeHtml(query)}" en cours...</p>
        </div>`;

      try {
        const data = await apiRequest(`/search?q=${encodeURIComponent(query)}&filter=all`);
        const streams = (data.items || []).filter(x => x.type === 'stream' || (x.url && x.url.includes('/watch?v=')));

        // If there is an exact/relevant channel result, preview it at top
        const channelItem = (data.items || []).find(x => x.type === 'channel');
        if (channelItem) {
          showSearchChannelPreview(channelItem);
        }

        if (streams.length === 0 && !channelItem) {
          grid.innerHTML = `
            <div class="error-container">
              <p>Aucune vidéo trouvée pour "${escapeHtml(query)}".</p>
            </div>`;
          return;
        }

        const items = streams.map(item => {
          const chId = (item.uploaderUrl || '').replace('/channel/', '');
          return {
            id: (item.url || '').replace('/watch?v=', ''),
            title: item.title,
            thumbnail: item.thumbnail || `https://i.ytimg.com/vi/${(item.url || '').replace('/watch?v=', '')}/hqdefault.jpg`,
            duration: item.duration,
            uploader: item.uploaderName,
            uploaderUrl: item.uploaderUrl,
            channelId: chId,
            avatar: item.uploaderAvatar,
            views: item.views,
            uploadedText: item.uploadedDate || ''
          };
        }).filter(x => x.id && x.title);

        renderGrid(items);
      } catch (err) {
        console.error(err);
        grid.innerHTML = `
          <div class="error-container">
            <p>Erreur lors de la recherche.</p>
            <button class="error-btn" onclick="searchVideos('${escapeHtml(query)}', false)">Réessayer</button>
          </div>`;
      }
    }

    function showSearchChannelPreview(ch) {
      const channelSection = document.getElementById('channel-header-section');
      channelSection.style.display = 'block';
      document.getElementById('channel-banner-wrapper').style.display = 'none';

      document.getElementById('channel-profile-avatar').src = ch.thumbnail || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666"><circle cx="12" cy="12" r="10"/></svg>';
      document.getElementById('channel-profile-name').textContent = ch.name || 'Chaîne YouTube';
      document.getElementById('channel-subscribers-count').textContent = ch.subscribers ? formatSubscribers(ch.subscribers) : 'Chaîne YouTube';
      document.getElementById('channel-videos-count').textContent = 'Chaîne officielle';
      document.getElementById('channel-profile-desc').textContent = ch.description || 'Cliquez pour ouvrir la chaîne et afficher toutes ses vidéos.';
      document.getElementById('channel-verified-badge').style.display = ch.verified ? 'inline-flex' : 'none';

      const chId = (ch.url || '').replace('/channel/', '');
      const card = document.querySelector('.channel-profile-card');
      card.style.cursor = 'pointer';
      card.title = 'Ouvrir la page complète de la chaîne';
      card.onclick = () => openChannel(chId, ch.name, ch.thumbnail, true);
      updateSubButtonState(ch.name);
    }

    // Open Channel View
    async function openChannel(channelId, channelName, avatarUrl, push = true) {
      if (push) {
        history.pushState(
          { view: 'channel', channelId, channelName, avatarUrl },
          '',
          `?c=${encodeURIComponent(channelId || '')}&name=${encodeURIComponent(channelName || '')}`
        );
        hasNavigated = true;
      }
      currentView = { type: 'channel', channelId, channelName, avatarUrl };
      updateNavButtons();

      window.scrollTo({ top: 0, behavior: 'smooth' });

      const channelSection = document.getElementById('channel-header-section');
      channelSection.style.display = 'block';

      const avatarEl = document.getElementById('channel-profile-avatar');
      avatarEl.src = avatarUrl || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666"><circle cx="12" cy="12" r="10"/></svg>';
      document.getElementById('channel-profile-name').textContent = channelName || 'Chaîne YouTube';
      document.getElementById('channel-subscribers-count').textContent = 'Chargement de la chaîne...';
      document.getElementById('channel-profile-desc').textContent = '';
      document.getElementById('channel-banner-wrapper').style.display = 'none';

      const card = document.querySelector('.channel-profile-card');
      card.style.cursor = 'default';
      card.onclick = null;
      updateSubButtonState(channelName);

      const title = document.getElementById('feed-title');
      title.textContent = `Vidéos de ${channelName || 'la chaîne'}`;

      const grid = document.getElementById('video-grid');
      grid.innerHTML = `
        <div class="loading-container">
          <div class="spinner"></div>
          <p>Chargement des vidéos de ${escapeHtml(channelName || 'la chaîne')}...</p>
        </div>`;

      try {
        let chData = null;
        if (channelId && channelId.startsWith('UC')) {
          chData = await apiRequest(`/channel/${channelId}`).catch(() => null);
        }

        if (chData) {
          if (chData.name) {
            document.getElementById('channel-profile-name').textContent = chData.name;
            channelName = chData.name;
          }
          if (chData.avatarUrl) avatarEl.src = chData.avatarUrl;
          if (chData.bannerUrl) {
            document.getElementById('channel-banner-img').src = chData.bannerUrl;
            document.getElementById('channel-banner-wrapper').style.display = 'block';
          }
          if (chData.subscriberCount) {
            document.getElementById('channel-subscribers-count').textContent = formatSubscribers(chData.subscriberCount);
          } else {
            document.getElementById('channel-subscribers-count').textContent = 'Chaîne YouTube';
          }
          if (chData.description) {
            document.getElementById('channel-profile-desc').textContent = chData.description;
          }
          document.getElementById('channel-verified-badge').style.display = chData.verified ? 'inline-flex' : 'none';
        } else {
          document.getElementById('channel-subscribers-count').textContent = 'Chaîne YouTube';
          document.getElementById('channel-verified-badge').style.display = 'none';
        }

        // Fetch channel videos
        let videos = (chData && chData.relatedStreams && chData.relatedStreams.length > 0) ? chData.relatedStreams : [];

        // If relatedStreams is empty, search videos by channel name
        if (videos.length === 0) {
          const queryName = channelName || (chData && chData.name);
          if (queryName) {
            const searchData = await apiRequest(`/search?q=${encodeURIComponent(queryName)}&filter=all`).catch(() => null);
            if (searchData && searchData.items) {
              videos = searchData.items.filter(x => x.type === 'stream' || (x.url && x.url.includes('/watch?v=')));
            }
          }
        }

        // Also check if channel tabs have shorts/videos if still empty
        if (videos.length === 0 && chData && chData.tabs && chData.tabs.length > 0) {
          for (const tab of chData.tabs) {
            try {
              const tabData = await apiRequest(`/channels/tabs?data=${encodeURIComponent(tab.data)}`);
              if (tabData && tabData.content && tabData.content.length > 0) {
                videos = videos.concat(tabData.content.filter(x => x.type === 'stream'));
              }
            } catch (_) {}
            if (videos.length > 0) break;
          }
        }

        if (videos.length === 0) {
          grid.innerHTML = `
            <div class="error-container">
              <p>Aucune vidéo disponible pour cette chaîne.</p>
            </div>`;
          return;
        }

        document.getElementById('channel-videos-count').textContent = `${videos.length} vidéos trouvées`;

        const items = videos.map(item => {
          const vChId = (item.uploaderUrl || '').replace('/channel/', '') || channelId;
          return {
            id: (item.url || '').replace('/watch?v=', ''),
            title: item.title,
            thumbnail: item.thumbnail || `https://i.ytimg.com/vi/${(item.url || '').replace('/watch?v=', '')}/hqdefault.jpg`,
            duration: item.duration,
            uploader: item.uploaderName || channelName || (chData && chData.name),
            uploaderUrl: item.uploaderUrl || (channelId ? `/channel/${channelId}` : ''),
            channelId: vChId,
            avatar: item.uploaderAvatar || (chData && chData.avatarUrl) || avatarUrl,
            views: item.views,
            uploadedText: item.uploadedDate || ''
          };
        }).filter(x => x.id && x.title);

        renderGrid(items);
      } catch (err) {
        console.error(err);
        grid.innerHTML = `
          <div class="error-container">
            <p>Impossible de charger les vidéos de la chaîne.</p>
            <button class="error-btn" onclick="openChannel('${escapeHtml(channelId)}', '${escapeHtml(channelName)}', '${escapeHtml(avatarUrl)}', false)">Réessayer</button>
          </div>`;
      }
    }

    function clearChannelHeader() {
      const channelSection = document.getElementById('channel-header-section');
      if (channelSection) {
        channelSection.style.display = 'none';
        const card = document.querySelector('.channel-profile-card');
        if (card) {
          card.style.cursor = 'default';
          card.onclick = null;
        }
      }
    }

    function toggleSubscribe(btn) {
      const chName = document.getElementById('channel-profile-name').textContent.trim();
      const subs = JSON.parse(localStorage.getItem('yt_subscribed') || '[]');
      const index = subs.indexOf(chName);
      if (index === -1) {
        subs.push(chName);
        localStorage.setItem('yt_subscribed', JSON.stringify(subs));
        btn.textContent = 'Abonné ✓';
        btn.classList.add('subscribed');
      } else {
        subs.splice(index, 1);
        localStorage.setItem('yt_subscribed', JSON.stringify(subs));
        btn.textContent = "S'abonner";
        btn.classList.remove('subscribed');
      }
    }

    function updateSubButtonState(name) {
      const btn = document.getElementById('channel-sub-btn');
      if (!btn || !name) return;
      const subs = JSON.parse(localStorage.getItem('yt_subscribed') || '[]');
      if (subs.includes(name)) {
        btn.textContent = 'Abonné ✓';
        btn.classList.add('subscribed');
      } else {
        btn.textContent = "S'abonner";
        btn.classList.remove('subscribed');
      }
    }

    function onSearchSubmit(e) {
      if (e) e.preventDefault();
      const val = document.getElementById('search-input').value.trim();
      if (!val) return;

      const directId = extractVideoId(val);
      if (directId) {
        playVideo({ id: directId, title: "Vidéo YouTube", uploader: "Lien direct" }, true);
        return;
      }

      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      searchVideos(val, true);
    }

    function selectChip(btn, action) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      action();
    }

    // Render Video Grid
    window._videoRegistry = {};

    function renderGrid(videos) {
      const grid = document.getElementById('video-grid');
      grid.innerHTML = '';
      window._videoRegistry = {};

      videos.forEach(v => {
        const viewsText = formatViews(v.views);
        const durationText = formatDuration(v.duration);
        const videoObj = { ...v, viewsText };
        window._videoRegistry[v.id] = videoObj;

        const card = document.createElement('div');
        card.className = 'video-card';
        card.onclick = (e) => {
          if (e.target.closest('.channel-click-target')) return;
          playVideo(videoObj, true);
        };

        const safeAvatar = v.avatar ? escapeHtml(v.avatar) : 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23333"><circle cx="12" cy="12" r="10"/></svg>';

        card.innerHTML = `
          <div class="thumb-wrapper">
            <img class="thumb-img" src="${escapeHtml(v.thumbnail)}" alt="${escapeHtml(v.title)}" loading="lazy" onerror="this.src='https://i.ytimg.com/vi/${v.id}/hqdefault.jpg'">
            ${durationText ? `<span class="video-duration">${durationText}</span>` : ''}
          </div>
          <div class="video-meta">
            <div class="avatar-clickable channel-click-target" title="Accéder à la chaîne ${escapeHtml(v.uploader || '')}" onclick="openChannel('${escapeHtml(v.channelId || '')}', '${escapeHtml(v.uploader || '')}', '${safeAvatar}', true)">
              <img class="channel-avatar" src="${safeAvatar}" alt="" loading="lazy">
            </div>
            <div class="video-info">
              <div class="video-title" title="${escapeHtml(v.title)}">${escapeHtml(v.title)}</div>
              <div class="channel-title channel-click-target" title="Accéder à la chaîne ${escapeHtml(v.uploader || '')}" onclick="openChannel('${escapeHtml(v.channelId || '')}', '${escapeHtml(v.uploader || '')}', '${safeAvatar}', true)">
                <span>${escapeHtml(v.uploader || 'Chaîne')}</span>
              </div>
              <div class="video-substats">
                ${viewsText ? `<span>${viewsText}</span>` : ''}
                ${viewsText && v.uploadedText ? `<span>•</span>` : ''}
                ${v.uploadedText ? `<span>${escapeHtml(v.uploadedText)}</span>` : ''}
              </div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function formatViews(views) {
      if (!views && views !== 0) return '';
      if (views >= 1000000) return (views / 1000000).toFixed(1).replace('.0', '').replace('.', ',') + ' M de vues';
      if (views >= 1000) return (views / 1000).toFixed(0) + ' k de vues';
      return views + ' vues';
    }

    function formatSubscribers(subs) {
      if (!subs && subs !== 0) return '0 abonnés';
      if (subs >= 1000000) return (subs / 1000000).toFixed(2).replace('.', ',').replace(',00', '') + ' M d\'abonnés';
      if (subs >= 1000) return (subs / 1000).toFixed(0) + ' k d\'abonnés';
      return subs + ' abonnés';
    }

    function formatDuration(sec) {
      if (!sec && sec !== 0) return '';
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);
      if (h > 0) {
        return `${h}:${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
      }
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Startup routing based on URL params
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const v = params.get('v');
      const c = params.get('c');
      const q = params.get('q');
      const name = params.get('name');

      if (v) {
        loadTrending(false);
        playVideo({ id: v, title: 'Vidéo YouTube', uploader: 'YouTube' }, false);
      } else if (c) {
        openChannel(c, name || 'Chaîne', '', false);
      } else if (q) {
        document.getElementById('search-input').value = q;
        searchVideos(q, false);
      } else {
        loadTrending(false);
      }
    });
  </script>
</body>
</html>
